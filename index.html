 if(r){S.favs=has?S.favs.filter(f=>!(f.kind===kind&&f.ref===ref)):[...(S.favs||[]),{kind,ref}];draw()}}
const sellFiltered=()=>{const k=S.iq.toLowerCase();return(S.inv||[]).filter(i=>i.quantity>0&&(!k||[i.medicines.trade_name,i.medicines.active_ingredient].some(x=>(x||'').toLowerCase().includes(k))))};

async function confirmSale(){const items=Object.entries(S.cart).filter(e=>e[1]>0).map(e=>({inventory_id:e[0],quantity:e[1]}));if(!items.length)return;
 const tot=(S.inv||[]).reduce((a,i)=>a+(S.cart[i.id]||0)*Number(i.selling_price),0);S.busy=true;draw();
 const r=await q(sb.rpc('record_sale',{p_pharmacy:S.ph.id,p_items:items}));S.cart={};await LD.inv();S.busy=false;draw();if(r)tst(L('تم تسجيل البيع: ','Sale recorded: ')+money(tot))}

 const cmp={price:(a,b)=>(a.quantity===0)-(b.quantity===0)||a.selling_price-b.selling_price,new:(a,b)=>new Date(b.updated_at)-new Date(a.updated_at),avail:(a,b)=>b.quantity-a.quantity,near:(a,b)=>(dist(a)??1e9)-(dist(b)??1e9)}[S.fs||'price'];return r.sort(cmp)};

async function saveMed(){const v={t:$('f1'),i:$('f2'),s:$('f3'),d:$('f4'),m:$('f5'),b:$('f11')};if(!v.t||!v.i||!$('f8'))return tst(L('الاسم والمادة وسعر البيع مطلوبة','Name, ingredient and selling price required'));
 const x={qty:+$('f6')||0,buy:+$('f7')||null,sell:+$('f8'),exp:$('f9')||null,bat:$('f10')||'-'};
 S.busy=true;draw();
 let med=await q(sb.from('medicines').select('id').ilike('trade_name',v.t).ilike('active_ingredient',v.i).ilike('strength',v.s||'').ilike('dosage_form',v.d||'').ilike('manufacturer',v.m||'').limit(1));
 let mid=med?.[0]?.id;
 if(!mid){const n=await q(sb.from('medicines').insert({trade_name:v.t,active_ingredient:v.i,strength:v.s,dosage_form:v.d,manufacturer:v.m,barcode:v.b||null}).select('id').single());mid=n?.id}
 if(mid){const r=await q(sb.from('inventory').insert({pharmacy_id:S.ph.id,medicine_id:mid,quantity:x.qty,purchase_price:x.buy,selling_price:x.sell,expiry_date:x.exp,batch_number:x.bat}).select());
  if(r){S.busy=false;S.stack.pop();S.scr='inv';await load();return tst(L('تمت إضافة الدواء','Medicine added'))}}
 S.busy=false;draw()}
async function resolveMed(v){let med=await q(sb.from('medicines').select('id').ilike('trade_name',v.t).ilike('active_ingredient',v.i).ilike('strength',v.s||'').ilike('dosage_form',v.d||'').ilike('manufacturer',v.m||'').limit(1));
 if(med?.[0])return med[0].id;const n=await q(sb.from('medicines').insert({trade_name:v.t,active_ingredient:v.i,strength:v.s,dosage_form:v.d,manufacturer:v.m,barcode:v.b||null}).select('id').single());return n?.id}
async function saveEdit(){const i=S.inv.find(x=>x.id===S.sel),m=i.medicines;const v={t:$('f1'),i:$('f2'),s:$('f3'),d:$('f4'),m:$('f5'),b:$('f11')};
 if(!v.t||!v.i||$('f8')==='')return tst(L('الاسم والمادة وسعر البيع مطلوبة','Name, ingredient and selling price required'));
 const x={quantity:+$('f6')||0,purchase_price:$('f7')===''?null:+$('f7'),selling_price:+$('f8'),expiry_date:$('f9')||null,batch_number:$('f10')||'-'};
 if(x.quantity<0||x.selling_price<0||(x.purchase_price!==null&&x.purchase_price<0))return tst(L('لا يمكن إدخال قيم سالبة','Negative values are not allowed'));
 const changed=v.t!==m.trade_name||v.i!==m.active_ingredient||v.s!==(m.strength||'')||v.d!==(m.dosage_form||'')||v.m!==(m.manufacturer||'');
 S.busy=true;draw();let mid=i.medicine_id;if(changed)mid=await resolveMed(v);
 if(mid){const r=await q(sb.from('inventory').update({...x,medicine_id:mid}).eq('id',i.id).select('*,medicines(*)').single());
  if(r){Object.assign(i,r);S.busy=false;S.stack.pop();S.scr='med';draw();return tst(L('تم حفظ التعديلات','Changes saved'))}}
 S.busy=false;draw()}

async function sell(){const i=S.inv.find(x=>x.id===S.sel);const r=await q(sb.rpc('record_sale',{p_pharmacy:S.ph.id,p_items:[{inventory_id:i.id,quantity:1}]}));if(r){await LD.inv();draw();tst(L('تم تسجيل البيع','Sale recorded'))}}

 return hdr(L('لوحة التحكم','Dashboard'),false)+(S.busy?spin():`<div class="pg"><div class="kpi">${[[L('إجمالي الأدوية','Total Medicines'),m.length],[L('متوفر','Available'),c('in_stock')],[L('كمية قليلة','Low Stock'),c('low_stock')],[L('نفد','Out of Stock'),c('out_of_stock')],[L('قارب الانتهاء','Expiring Soon'),m.filter(soon).length],[L('مبيعات اليوم','Today\'s Sales'),(S.sales||[]).length],[L('إيرادات اليوم','Today\'s Revenue'),money(rev)]].map(k=>`<div class="card"><span class="m">${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div><button class="btn s" onclick="go('report')">📈 ${L('تقارير المبيعات','Sales reports')}</button></div>`)+nav()},

 return hdr(L('المخزون','Inventory'),false)+`<div class="pg"><input value="${esc(S.iq)}" placeholder="🔍 ${L('الاسم، المادة، المصنّع، الباركود','Name, ingredient, manufacturer, barcode')}" oninput="S.iq=this.value;il()"><div class="chips">${fl.map(x=>`<button class="chip ${S.filter===x[0]?'on':''}" onclick="S.filter='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>

add:()=>hdr('+ Add Medicine')+`<div class="pg">${fld('f1','Trade Name')}${fld('f2','Active Ingredient')}<div class="row"><div>${fld('f3','Strength')}</div><div>${fld('f4','Dosage Form')}</div></div>${fld('f5','Manufacturer')}${fld('f11','Barcode')}${fld('f6','Quantity','number')}<div class="row"><div>${fld('f7','Purchase Price','number')}</div><div>${fld('f8','Selling Price','number')}</div></div>${fld('f9','Expiry Date','date')}${fld('f10','Batch Number')}<button class="btn" ${S.busy?'disabled':''} onclick="saveMed()">${S.busy?'…':L('حفظ','Save')}</button></div>`,
med:()=>{const i=S.inv.find(x=>x.id===S.sel);if(!i)return hdr('…')+spin();const m=i.medicines;const rows=[['Name',m.trade_name],['Active Ingredient',m.active_ingredient],['Strength',m.strength],['Manufacturer',m.manufacturer],['Quantity',i.quantity],['Purchase Price',money(i.purchase_price)],['Selling Price',money(i.selling_price)],['Expiry Date',i.expiry_date],['Batch Number',i.batch_number],['Last Updated',ago(i.updated_at)]];
 return hdr(esc(m.trade_name))+`<div class="pg"><div class="card"><span class="b ${i.availability}">${AV(i.availability)}</span>${rows.map(r=>`<div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="m">${r[0]}</span><b style="text-align:end">${esc(r[1]??'—')}</b></div>`).join('')}</div>
<div class="row"><button class="btn s" onclick="adj(-1)">− Decrease Stock</button><button class="btn" onclick="adj(1)">+ Increase Stock</button></div><button class="btn s" onclick="go('edit')">✎ Edit</button><button class="btn s" onclick="editPrice()">✎ Edit price</button><button class="btn s" ${i.quantity<1?'disabled':''} onclick="sell()">🧾 ${L('بيع وحدة واحدة','Sell 1 unit')}</button><button class="btn d" onclick="delItem()">🗑 ${L('حذف من المخزون','Delete from inventory')}</button></div>`},
sell:()=>{const n=Object.values(S.cart).reduce((a,b)=>a+b,0),tot=(S.inv||[]).reduce((a,i)=>a+(S.cart[i.id]||0)*Number(i.selling_price),0);
 return hdr(L('بيع جديد','New Sale'),false)+`<div class="pg"><div class="card"><div class="row sp"><span>${L('عدد الوحدات','Units')}: <b>${n}</b></span><b>${money(tot)}</b></div><button class="btn" ${n&&!S.busy?'':'disabled'} onclick="confirmSale()">🧾 ${L('تأكيد البيع','Confirm sale')}</button></div>
<input value="${esc(S.iq)}" placeholder="🔍 ${L('ابحث عن دواء','Search medicine')}" oninput="S.iq=this.value;sl()"><div id="sl">${S.busy?spin():sellRows()}</div></div>`+nav()},
report:()=>{const days=S.per==='today'?1:+S.per;const from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-(days-1));
 const rows=(S.rep||[]).filter(r=>new Date(r.created_at)>=from);
 const units=rows.reduce((a,r)=>a+r.sale_items.reduce((x,i)=>x+i.quantity,0),0),rev=rows.reduce((a,r)=>a+Number(r.total_amount),0);
 const by={};rows.forEach(r=>{const k=new Date(r.created_at).toLocaleDateString('en-CA');(by[k]=by[k]||{n:0,t:0}).n++;by[k].t+=Number(r.total_amount)});
 const dk=Object.keys(by).sort().reverse(),mx=Math.max(1,...dk.map(k=>by[k].t));
 const tp={};rows.forEach(r=>r.sale_items.forEach(i=>{const m=i.medicines||{},k=(m.trade_name||'?')+' '+(m.strength||'');tp[k]=tp[k]||{u:0,t:0};tp[k].u+=i.quantity;tp[k].t+=i.quantity*Number(i.selling_price)}));
 const top=Object.entries(tp).sort((a,b)=>b[1].u-a[1].u).slice(0,5),tm=top.length?top[0][1].u:1;
 const per=[['today',L('اليوم','Today')],['7',L('7 أيام','7 days')],['30',L('30 يومًا','30 days')]];
 return hdr(L('تقارير المبيعات','Sales Reports'))+`<div class="pg"><div class="chips">${per.map(x=>`<button class="chip ${S.per===x[0]?'on':''}" onclick="S.per='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>
${S.busy?spin():!rows.length?empty(L('لا توجد مبيعات في هذه الفترة.','No sales in this period.')):`<div class="kpi">${[[L('عدد العمليات','Sales'),rows.length],[L('الوحدات المباعة','Units sold'),units],[L('الإيرادات','Revenue'),money(rev)],[L('متوسط العملية','Avg. sale'),money(rev/rows.length)]].map(k=>`<div class="card"><span class="m">${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
<h3>${L('المبيعات اليومية','Daily sales')}</h3><div class="card">${dk.map(k=>`<div class="row sp"><span class="m">${k}</span><span class="m f0">${by[k].n} · ${money(by[k].t)}</span></div><div class="bar" style="width:${by[k].t/mx*100}%"></div>`).join('')}</div>
<h3>${L('الأكثر مبيعًا','Top sellers')}</h3><div class="card">${top.map(([n,v])=>`<div class="row sp"><span>${esc(n)}</span><span class="m f0">${v.u} ${L('وحدة','units')} · ${money(v.t)}</span></div><div class="bar" style="width:${v.u/tm*100}%"></div>`).join('')}</div>
<h3>${L('آخر العمليات','Recent sales')}</h3>${rows.slice(0,10).map(r=>`<div class="card"><div class="row sp"><span class="m">${new Date(r.created_at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><b class="f0">${money(r.total_amount)}</b></div><div class="m">${r.sale_items.map(i=>esc((i.medicines?.trade_name||'?'))+' ×'+i.quantity).join('، ')}</div></div>`).join('')}`}</div>`+nav()},
notifs:()=>hdr(L('الإشعارات','Notifications'))+`<div class="pg">${S.busy?spin():(S.notifs||[]).length?S.notifs.map(n=>`<div class="card" style="${n.read?'':'border-color:var(--pri)'}"><b>${NT(n)}</b><div class="m" style="margin-top:6px">${new Date(n.created_at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):empty(L('لا توجد إشعارات.','No notifications.'))}</div>`,
users:()=>{const cnt=x=>(S.users||[]).filter(u=>u.role===x).length;
 return hdr(L('المستخدمون','Users'),false)+`<div class="pg"><input value="${esc(S.uq||'')}" placeholder="🔍 ${L('الاسم أو البريد أو الهاتف','Name, email or phone')}" oninput="S.uq=this.value;ul()"><div class="chips">${[['',L('الكل','All')+' '+(S.users||[]).length],['patient',L('مرضى','Patients')+' '+cnt('patient')],['pharmacist',L('صيادلة','Pharmacists')+' '+cnt('pharmacist')],['admin',L('مديرون','Admins')+' '+cnt('admin')]].map(x=>`<button class="chip ${(S.ur||'')===x[0]?'on':''}" onclick="S.ur='${x[0]}';draw()">${x[1]}</button>`).join('')}</div><div id="ul">${S.busy?spin():userRows()}</div></div>`+nav()},
edit:()=>{const i=(S.inv||[]).find(x=>x.id===S.sel);if(!i)return hdr('…')+spin();const m=i.medicines;
 return hdr(L('تعديل دواء','Edit Medicine'))+`<div class="pg">${fld('f1','Trade Name','text',m.trade_name)}${fld('f2','Active Ingredient','text',m.active_ingredient)}<div class="row"><div>${fld('f3','Strength','text',m.strength||'')}</div><div>${fld('f4','Dosage Form','text',m.dosage_form||'')}</div></div>${fld('f5','Manufacturer','text',m.manufacturer||'')}${fld('f11','Barcode','text',m.barcode||'')}${fld('f6','Quantity','number',i.quantity)}<div class="row"><div>${fld('f7','Purchase Price','number',i.purchase_price??'')}</div><div>${fld('f8','Selling Price','number',i.selling_price)}</div></div>${fld('f9','Expiry Date','date',i.expiry_date||'')}${fld('f10','Batch Number','text',i.batch_number||'')}
<div class="note">${L('تعديل الاسم أو المادة أو التركيز يربط دواءك بالصنف المطابق في الكتالوج، ولا يغيّر أدوية الصيدليات الأخرى.','Changing name, ingredient or strength points your item to the matching catalog entry; other pharmacies are not affected.')}</div>
<button class="btn" ${S.busy?'disabled':''} onclick="saveEdit()">${S.busy?'…':L('حفظ','Save')}</button></div>`},
mypharm:()=>{const p=S.ph;return hdr(L('صيدليتي','My Pharmacy'),false)+`<div class="pg"><div class="card"><span class="b ${p.verification_status}">${ST(p.verification_status)}</span>
${fld('mn',L('اسم الصيدلية','Pharmacy Name'),'text',p.pharmacy_name)}${fld('mp',L('الهاتف','Phone'),'tel',p.pharmacy_phone||'')}<div class="row"><div>${fld('ms',L('الولاية','State'),'text',p.state||'')}</div><div>${fld('mc',L('المدينة','City'),'text',p.city||'')}</div></div>${fld('mr',L('المنطقة','Area'),'text',p.area||'')}${fld('ma',L('العنوان','Address'),'text',p.address||'')}${fld('mh',L('ساعات العمل','Opening Hours'),'text',p.opening_hours||'')}
<label>${L('الوصف','Description')}</label><textarea id="md" rows="3">${esc(p.description||'')}</textarea><div class="note">📍 ${p.lat!=null?L('تم تحديد موقع الصيدلية ✅','Pharmacy location is set ✅'):L('لم يُحدد موقع الصيدلية بعد، فلن تظهر المسافة للمرضى','Location not set yet, so patients cannot see the distance')}</div><button class="btn s" onclick="setPharmLoc()">📍 ${L('حدد موقع صيدليتي (من مكان وقوفك الآن)','Set my pharmacy location (from where you stand now)')}</button><button class="btn" onclick="savePh()">${L('حفظ التعديلات','Save changes')}</button></div></div>`+nav()},
adm:()=>hdr(L('لوحة المدير','Admin'),false)+`<div class="pg"><div class="note">${L('المدير: توثيق + متابعة + تحليلات فقط.','Admin: verification, monitoring and analytics only.')}</div><h3>Pharmacist Applications</h3><div class="chips">${[['',L('الكل','All')],['pending',ST('pending')],['info_requested',ST('info_requested')],['approved',ST('approved')],['suspended',ST('suspended')],['rejected',ST('rejected')]].map(x=>`<button class="chip ${(S.af||'')===x[0]?'on':''}" onclick="S.af='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>${S.busy?spin():appsF().length?appsF().map(a=>`<div class="card t" onclick="go('app','${a.id}')"><div class="row sp"><b>${esc(a.profiles?.full_name||'—')}</b><span class="b ${a.verification_status} f0">${ST(a.verification_status)}</span></div><div class="m">🏥 ${esc(a.pharmacy_name)} · ${esc(a.city||'')} · ${new Date(a.created_at).toLocaleDateString('en-GB')}</div></div>`).join(''):empty(L('لا توجد طلبات.','No applications.'))}</div>`+nav(),
app:()=>{const a=(S.apps||[]).find(x=>x.id===S.sel);if(!a)return hdr('…')+spin();return hdr(esc(a.pharmacy_name))+`<div class="pg"><div class="card"><div class="row sp"><b>${esc(a.pharmacy_name)}</b><span class="b ${a.verification_status} f0">${ST(a.verification_status)}</span></div><p class="m">${L('مقدم الطلب','Applicant')}: ${esc(a.profiles?.full_name)}<br>${esc(a.profiles?.email)} · ${esc(a.profiles?.phone||'')}<br>${esc(a.state||'')} / ${esc(a.city||'')} / ${esc(a.area||'')}<br>${esc(a.address||'')}<br>${L('رقم الرخصة','License')}: ${esc(a.license_number||'—')}</p>
<div class="row">${a.license_document_url?`<button class="btn s" data-p="${esc(a.license_document_url)}" onclick="viewDoc(this.dataset.p)">📄 ${L('الرخصة','License')}</button>`:''}${a.pharmacist_document_url?`<button class="btn s" data-p="${esc(a.pharmacist_document_url)}" onclick="viewDoc(this.dataset.p)">🪪 ID</button>`:''}</div>${!a.license_document_url&&!a.pharmacist_document_url?`<p class="m">${L('لا توجد وثائق مرفوعة','No documents uploaded')}</p>`:''}${a.verification_status==='approved'?`<button class="btn d" onclick="review('${a.id}','suspended')">⏸ ${L('إيقاف الصيدلية','Suspend pharmacy')}</button>`:a.verification_status==='suspended'?`<button class="btn" onclick="review('${a.id}','approved')">▶ ${L('إعادة التفعيل','Reinstate')}</button>`:`<button class="btn" onclick="review('${a.id}','approved')">✔ Approve</button><button class="btn d" onclick="review('${a.id}','rejected')">✖ Reject</button><button class="btn s" onclick="review('${a.id}','info_requested')">Request More Information</button>`}</div></div>`},
ana:()=>{const a=S.an;const bars=(t,d)=>`<h3>${t}</h3><div class="card">${d?.length?d.map(x=>`<div class="m">${esc(x.name)} — ${x.n}</div><div class="bar" style="width:${x.n/d[0].n*100}%"></div>`).join(''):empty(L('لا بيانات بعد','No data yet'))}</div>`;
 return hdr(L('التحليلات','Analytics'),false)+(S.busy||!a?spin():`<div class="pg"><div class="kpi">${[['Total Patients',a.patients],['Total Pharmacists',a.pharmacists],['Total Pharmacies',a.pharmacies],['Pending Applications',a.pending_applications],['Registered Medicines',a.medicines],['Medicine Searches',a.searches],['Pharmacy Profile Visits',a.profile_visits],['Medicines Sold',a.items_sold],['Recorded Revenue',money(a.revenue)]].map(k=>`<div class="card"><span class="m">${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>${bars('Most Searched Medicines',a.top_searched)}${bars('Most Visited Pharmacies',a.top_pharmacies)}</div>`)+nav()}};
function nav(){const adm=S.pr?.role==='admin';const set=adm?[['adm','📋',L('الطلبات','Applications')],['ana','📈',L('التحليلات','Analytics')],['users','👥',L('المستخدمون','Users')],['out','🚪',L('خروج','Logout')]]:[['dash','📊',L('الرئيسية','Home')],['inv','📦',L('المخزون','Inventory')],['sell','🧾',L('بيع','Sale')],['mypharm','🏥',L('صيدليتي','Pharmacy')],['out','🚪',L('خروج','Logout')]];
 return `<div class="nav">${set.map(x=>`<button class="${S.scr===x[0]?'on':''}" onclick="${x[0]==='out'?'logout()':`root('${x[0]}')`}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
function draw(){const a=document.getElementById('app'),y=scrollY,fo=document.activeElement;if(fo&&['INPUT','TEXTAREA'].includes(fo.tagName)&&fo.id==='il')return;
 let h=V[S.scr]()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');if(S.lang==='ar')h=h.replace(/>([^<>]+)</g,(m,t)=>AR[t.trim()]?'>'+AR[t.trim()]+'<':m);a.innerHTML=h;scrollTo(0,y)}
sb.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY'){S.scr='newpw';draw()}});
if(/type=recovery/.test(location.hash)){S.scr='newpw';draw()}else route();
